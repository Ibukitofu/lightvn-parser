[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lvparse-tool"
version = "0.1.0"
description = "Light.vn visual-novel script parser and corpus indexer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# lvlib (XOR codec for .mcdat) lives in the translation workspace, not here.
codec = []
test = []

[tool.setuptools]
packages = ["lvparse_tool"]
package-dir = {"lvparse_tool" = "."}
include-package-data = true

[tool.setuptools.package-data]
lvparse_tool = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
